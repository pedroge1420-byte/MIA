<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>MIA - Tu inteligencia artificial</title>
<style>
:root{--bg:#080b16;--cyan:#62e4ef;--violet:#a78bfa;--text:#edf4ff;--muted:#9aabc5;--border:#2a3b59}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#20325b,#080b16 65%);color:var(--text);font-family:Arial,sans-serif}
.app{width:min(100%,900px);height:100dvh;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px}
.brand{display:flex;align-items:center;gap:12px}
.orb{width:45px;height:45px;border-radius:50%;background:radial-gradient(circle at 30% 25%,white,#62e4ef 25%,#7867ec 65%,#172044);box-shadow:0 0 25px #62e4ef77}
h1{margin:0;letter-spacing:4px}.subtitle{font-size:11px;color:var(--muted)}.status{color:#61dfb0;font-size:11px}
main{flex:1;min-height:0;display:flex;flex-direction:column;background:#0e1729ed;border:1px solid var(--border);border-radius:22px;overflow:hidden}
.welcome{text-align:center;padding:28px 15px}.welcome .orb{margin:0 auto 15px;width:65px;height:65px}.welcome p{color:var(--muted);font-size:13px;line-height:1.6}
#messages{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:90%;padding:13px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:linear-gradient(135deg,#354d7a,#453b80)}
.mia{align-self:flex-start;background:#17263e;border:1px solid #2c405f}
.who{display:block;color:var(--cyan);font-size:10px;margin-bottom:6px;font-weight:bold}
.resultimg{max-width:100%;max-height:350px;border-radius:12px;margin-top:10px}
.controls{border-top:1px solid var(--border);padding:12px;background:#0b1424}
.modes{display:flex;gap:7px;overflow-x:auto;margin-bottom:10px}
.mode{flex:none;background:#17243a;color:white;border:1px solid var(--border);padding:8px 12px;border-radius:20px;font-size:11px}
.mode.active{border-color:var(--cyan);color:var(--cyan)}
.composer{display:flex;align-items:center;gap:6px;padding:6px;background:#111e32;border:1px solid #354866;border-radius:17px}
button{cursor:pointer}.iconbtn{width:38px;height:38px;flex:none;border:0;border-radius:12px;background:transparent;color:white;font-size:20px}
textarea{flex:1;min-width:0;min-height:38px;max-height:100px;resize:none;border:0;outline:none;background:transparent;color:white;font-size:14px;padding:9px 4px}
textarea::placeholder{color:#8294b1}.send{background:linear-gradient(135deg,#62e4ef,#a78bfa);color:#080b16;font-weight:bold}
#attachments{display:none}.preview{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filechip{font-size:11px;background:#192944;padding:7px;border-radius:8px}
.footer{text-align:center;color:#8294b1;font-size:10px;padding:8px}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="orb"></div><div><h1>MIA</h1><div class="subtitle">Tu inteligencia artificial</div></div></div><div class="status" id="status">● Lista</div></header>
<main>
<section class="welcome" id="welcome"><div class="orb"></div><h2>Hola, soy MIA</h2><p>Estoy aquí para ayudarte. Puedes conversar conmigo, hacer preguntas, adjuntar imágenes y documentos.</p></section>
<div id="messages"></div>
<div class="controls">
<div class="modes"><button class="mode active" data-mode="chat">Chat</button><button class="mode" data-mode="image">Crear imagen</button><button class="mode" data-mode="ocr">Leer imagen</button></div>
<div class="preview" id="preview"></div>
<div class="composer"><button class="iconbtn" id="attach" aria-label="Adjuntar">＋</button><textarea id="prompt" rows="1" placeholder="Escribe tu mensaje..."></textarea><button class="iconbtn" id="mic" aria-label="Micrófono">🎙</button><button class="iconbtn send" id="send" aria-label="Enviar">➤</button></div>
<div class="footer">MIA · Asistente inteligente</div>
</div>
</main>
<input id="attachments" type="file" accept="image/*,.pdf,.txt" multiple>
</div>
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=id=>document.getElementById(id),messages=$('messages'),prompt=$('prompt');
let files=[],mode='chat',history=[];
const SYSTEM='Eres MIA, una inteligencia artificial amable, cercana e inteligente que habla español colombiano. Responde de forma clara y natural. Ayuda con educación, ciencia, tecnología, cultura y vida cotidiana. En asuntos médicos ofrece información prudente, nunca inventes diagnósticos y recomienda consultar profesionales. No afirmes haber consultado internet si no tienes acceso real a búsqueda web.';
function setStatus(t){$('status').textContent='● '+t}
function addMessage(role,text){$('welcome').style.display='none';const d=document.createElement('div');d.className='msg '+role;const w=document.createElement('span');w.className='who';w.textContent=role==='user'?'TÚ':'MIA';d.append(w);const c=document.createElement('span');c.textContent=text;d.append(c);messages.append(d);messages.scrollTop=messages.scrollHeight;return d}
$('attach').onclick=()=>$('attachments').click();
$('attachments').onchange=e=>{files=[...files,...e.target.files].slice(0,5);$('preview').innerHTML='';files.forEach(f=>{const c=document.createElement('span');c.className='filechip';c.textContent='📎 '+f.name;$('preview').append(c)});e.target.value=''};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));prompt.placeholder=mode==='image'?'Describe la imagen que quieres crear...':mode==='ocr'?'Adjunta una imagen para leerla...':'Escribe tu mensaje...'});
async function readPDF(f){if(!window.pdfjsLib)throw Error('No se pudo cargar el lector PDF.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let out='';for(let i=1;i<=Math.min(pdf.numPages,10);i++){const p=await pdf.getPage(i),c=await p.getTextContent();out+=c.items.map(x=>x.str).join(' ')+'\n'}return out}
async function send(){const q=prompt.value.trim(),chosen=[...files];if(!q&&!chosen.length)return;files=[];$('preview').innerHTML='';prompt.value='';addMessage('user',q||'Revisa los archivos adjuntos.');const loading=addMessage('mia','MIA está pensando...');setStatus('Procesando...');
try{if(!window.puter?.ai)throw Error('El servicio de IA no está disponible.');let extra='',images=[];for(const f of chosen){if(f.type.startsWith('image/'))images.push(f);else if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'))extra+='\nDocumento '+f.name+':\n'+await readPDF(f);else extra+='\nDocumento '+f.name+':\n'+await f.text()}
let answer='';
if(mode==='image'){const img=await puter.ai.txt2img(q);loading.textContent='Imagen generada:';loading.append(img);setStatus('Lista');return}
if(mode==='ocr'){if(!images.length)throw Error('Adjunta una imagen primero.');for(const f of images)answer+=(await puter.ai.img2txt(f))+'\n';if(q)answer+='\n'+q}
else{let input=SYSTEM+'\n'+(q||'Analiza los archivos adjuntos.')+extra;if(images.length){const urls=await Promise.all(images.map(f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})));input+='\nSe adjuntaron '+urls.length+' imagen(es).';}const result=await puter.ai.chat(input);answer=result?.message?.content??result?.text??String(result);if(typeof answer!=='string')answer=JSON.stringify(answer)}
loading.textContent=answer;history.push({question:q,answer});try{localStorage.setItem('mia_history',JSON.stringify(history.slice(-30)))}catch(e){}setStatus('Lista')
}catch(err){loading.textContent='No pude completar la solicitud: '+err.message;setStatus('Error')}}
$('send').onclick=send;prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null;
if(Speech){recognition=new Speech();recognition.lang='es-CO';recognition.onresult=e=>{prompt.value=e.results[0][0].transcript};recognition.onstart=()=>setStatus('Escuchando...');recognition.onend=()=>setStatus('Lista')}
$('mic').onclick=()=>{if(!recognition){addMessage('mia','Tu navegador no admite dictado por voz. Prueba Google Chrome.');return}try{recognition.start()}catch(e){setStatus('Micrófono ocupado')}};
messages.addEventListener('click',e=>{const m=e.target.closest('.mia');if(!m||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m.innerText);u.lang='es-CO';speechSynthesis.speak(u)});
try{history=JSON.parse(localStorage.getItem('mia_history')||'[]')}catch(e){history=[]}
</script>
</body>
</html>
